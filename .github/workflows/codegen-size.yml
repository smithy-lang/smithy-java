name: Codegen Size

on:
  pull_request:
    branches: [main]
    paths:
      - 'codegen/**'
      - '!codegen/**/src/test/**'
      - '!codegen/**/src/it/**'
      - '!codegen/**/src/jmh/**'
      - '!**.md'
      - 'scripts/codegen-size/**'
      - '.github/workflows/codegen-size.yml'

permissions:
  contents: read

concurrency:
  group: codegen-size-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    name: EC2 codegen size
    timeout-minutes: 45
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7

      - name: Check out base commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Cache compiled buildscripts
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-gradle-${{ hashFiles('buildSrc/**/*.kts') }}
          path: |
            ./buildSrc/build

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches

      - name: Resolve the EC2 model
        run: >
          ./gradlew -I scripts/codegen-size/codegen-size.init.gradle
          :codegen:codegen-plugin:codegenSizeModel
          "-PcodegenSizeModelFile=$RUNNER_TEMP/codegen-size/ec2.jar"

      - name: Measure base commit
        run: >
          scripts/codegen-size/measure.sh base
          "$RUNNER_TEMP/codegen-size/ec2.jar"
          "$RUNNER_TEMP/codegen-size/report/base.json"

      - name: Measure pull request
        run: >
          scripts/codegen-size/measure.sh .
          "$RUNNER_TEMP/codegen-size/ec2.jar"
          "$RUNNER_TEMP/codegen-size/report/pr.json"
          --baseline "$RUNNER_TEMP/codegen-size/report/base.json"
          --markdown "$RUNNER_TEMP/codegen-size/report/report.md"

      - name: Finish report
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          report="$RUNNER_TEMP/codegen-size/report"
          {
            echo
            echo "Base: \`$BASE_REF\` at ${BASE_SHA:0:9}. PR: ${HEAD_SHA:0:9} merged into the base. [Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          } >> "$report/report.md"
          echo "$PR_NUMBER" > "$report/pr-number"
          cat "$report/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: codegen-size-report
          path: ${{ runner.temp }}/codegen-size/report
          retention-days: 30
